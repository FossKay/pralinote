[package]
name = "pronote_rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
chrono = "0.4"
hex = "0.4"
md-5 = "0.10"
paste = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false,  features = ["rustls-tls", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uniffi = { version = "0.31", features = ["cli", "tokio"] }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
